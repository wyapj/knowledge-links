<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <title>wyapj 知识链接图谱</title>
    <style>
      :root {
        --bg: #07131a;
        --panel: rgba(11, 22, 30, 0.78);
        --panel-strong: rgba(14, 28, 37, 0.92);
        --line: rgba(138, 176, 203, 0.28);
        --text: #e8f3ff;
        --muted: #a7c2d8;
        --accent: #7fd7ff;
        --accent-2: #8cffb9;
        --accent-3: #ffd36b;
        --shadow: rgba(0, 0, 0, 0.35);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Inter, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
        background:
          radial-gradient(circle at 15% 20%, rgba(58, 130, 180, 0.28), transparent 18%),
          radial-gradient(circle at 80% 10%, rgba(123, 92, 255, 0.22), transparent 20%),
          linear-gradient(135deg, #050b10 0%, #0a1520 28%, #091820 100%);
        color: var(--text);
        min-height: 100vh;
      }

      .app {
        max-width: 1500px;
        margin: 0 auto;
        padding: 32px 24px 40px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
      }

      .title-wrap h1 {
        margin: 0;
        font-size: clamp(28px, 4vw, 44px);
        letter-spacing: 0.06em;
      }

      .title-wrap p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .chip {
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(122, 194, 255, 0.08);
        border: 1px solid rgba(134, 188, 222, 0.3);
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 2.2fr) minmax(300px, 0.9fr);
        gap: 24px;
        align-items: start;
      }

      .graph-panel,
      .info-panel {
        background: var(--panel);
        border: 1px solid rgba(136, 172, 214, 0.25);
        border-radius: 18px;
        box-shadow: 0 20px 45px var(--shadow);
        backdrop-filter: blur(8px);
      }

      .graph-panel {
        padding: 10px 10px 8px;
      }

      .graph-shell {
        position: relative;
        border-radius: 14px;
        overflow: hidden;
        background: linear-gradient(180deg, rgba(9, 20, 31, 0.75), rgba(8, 17, 23, 0.85));
        border: 1px solid rgba(127, 185, 228, 0.15);
      }

      svg {
        display: block;
        width: 100%;
        height: 760px;
        background-image:
          linear-gradient(rgba(133, 178, 214, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(133, 178, 214, 0.04) 1px, transparent 1px);
        background-size: 26px 26px;
      }

      .node {
        cursor: pointer;
        transition: transform 0.18s ease, filter 0.18s ease;
      }

      .node circle {
        stroke: rgba(225, 240, 255, 0.7);
        stroke-width: 1.2;
        filter: drop-shadow(0 0 10px rgba(123, 216, 255, 0.3));
      }

      .node:hover circle,
      .node.active circle {
        stroke-width: 2.2;
        filter: drop-shadow(0 0 12px rgba(127, 215, 255, 0.7));
      }

      .node text {
        font-size: 12px;
        fill: var(--text);
        text-anchor: middle;
        dominant-baseline: middle;
        pointer-events: none;
        font-weight: 600;
      }

      .node .label-bg {
        fill: rgba(5, 13, 20, 0.55);
        stroke: rgba(166, 209, 241, 0.15);
      }

      .edge {
        stroke: rgba(146, 198, 230, 0.38);
        stroke-width: 1.4;
      }

      .info-panel {
        padding: 18px 18px 12px;
        position: sticky;
        top: 18px;
      }

      .info-panel h2 {
        margin: 0 0 14px;
        font-size: 22px;
      }

      .project-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }

      .badge {
        display: inline-block;
        padding: 6px 9px;
        border-radius: 999px;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border: 1px solid rgba(126, 217, 253, 0.5);
        background: rgba(126, 217, 253, 0.1);
        color: var(--accent);
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 8px 0 12px;
      }

      .meta span {
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(162, 196, 224, 0.08);
        border: 1px solid rgba(162, 196, 224, 0.22);
        font-size: 11px;
        color: var(--muted);
      }

      .intro {
        margin: 0 0 18px;
        line-height: 1.7;
        color: #dfeefb;
        font-size: 14px;
      }

      .panel-link {
        display: inline-block;
        margin-bottom: 16px;
        text-decoration: none;
        color: var(--accent-2);
        font-weight: 600;
      }

      .related {
        margin-top: 10px;
        padding-top: 14px;
        border-top: 1px solid rgba(160, 184, 210, 0.18);
      }

      .related h3 {
        margin: 0 0 10px;
        font-size: 13px;
        letter-spacing: 0.08em;
        color: var(--muted);
        text-transform: uppercase;
      }

      .related-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 8px;
      }

      .related-list a {
        display: block;
        padding: 8px 10px;
        border-radius: 10px;
        background: rgba(143, 194, 225, 0.06);
        border: 1px solid rgba(143, 194, 225, 0.16);
        color: var(--text);
        text-decoration: none;
        font-size: 13px;
      }

      .legend {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid rgba(160, 184, 210, 0.18);
      }

      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }

      .legend-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
        border: 1px solid rgba(255, 255, 255, 0.5);
      }

      @media (max-width: 1080px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .info-panel {
          position: static;
        }
      }
    </style>
  </head>

        { id: 'openpilot', name: 'openpilot', repo: 'commaai/openpilot', category: 'AutonomousDriving', color: '#ffd36b', x: 1450, y: 110, url: 'https://github.com/commaai/openpilot', summary: '面向实际驾驶辅助系统的开源实现，体现工程落地与系统稳定性之间的平衡。', tags: ['ADAS', '驾驶辅助', '工程'] },
        { id: 'onevl', name: 'onevl', repo: 'xiaomi-research/onevl', category: 'AutonomousDriving', color: '#ffd36b', x: 900, y: 760, url: 'https://github.com/xiaomi-research/onevl', summary: '面向视觉语言与场景理解的端到端自动驾驶研究资源，强调统一语义理解与决策。', tags: ['多模态', 'ADAS', '研究'] },
        { id: 'recogdrive', name: 'recogdrive', repo: 'xiaomi-research/recogdrive', category: 'AutonomousDriving', color: '#ffd36b', x: 1100, y: 760, url: 'https://github.com/xiaomi-research/recogdrive', summary: '强化认知驱动的自动驾驶框架，强调从感知到决策的认知增强设计。', tags: ['认知', '强化学习', '驾驶'] }
      ];

      const edges = [
        ['llm-master', 'foundations-llms'], ['llm-master', 'llm-cookbook'], ['llm-master', 'dive-into-llms'],
        ['llm-master', 'learn-ai-engineering'], ['foundations-llms', 'dive-into-llms'], ['llm-cookbook', 'learn-ai-engineering'],
        ['rag-techniques', 'agents-towards-production'], ['agents-towards-production', 'ecc'], ['deepseek-coder', 'awesome-deepseek'],
        ['clip', 'bevformer'], ['bevformer', 'uniad'], ['openpcdet', 'uniad'], ['uniad', 'end2end-driving'],
        ['autoware', 'autoware-universe'], ['autoware', 'apollo'], ['autoware', 'openpilot'], ['apollo', 'openpilot'],
        ['highwayenv', 'tactics2d'], ['highwayenv', 'stable-baselines3'], ['python-robotics', 'cpp-robotics'],
        ['habitat-lab', 'vln-ce'], ['habitat-lab', 'navgpt'], ['vln-ce', 'navgpt'], ['clip', 'vln-ce'], ['clip', 'navgpt'],
        ['navigation2', 'obstacle-detector'], ['laser-geometry', 'obstacle-detector'], ['laser-geometry', 'fusioncore'],
        ['robot-bus', 'navigation2'], ['robot-bus', 'fusioncore'], ['habitat-lab', 'navigation2'], ['autoware', 'navigation2'],
        ['python-robotics', 'navigation2'], ['python-robotics', 'obstacle-detector'], ['stable-baselines3', 'highwayenv'],
        ['recogdrive', 'onevl'], ['uniad', 'recogdrive'], ['onevl', 'end2end-driving'], ['autoware', 'uniad']
      ];

      const nodeMap = Object.fromEntries(nodes.map(node => [node.id, node]));
      const svg = document.getElementById('graph');
      const infoName = document.getElementById('project-name');
      const infoTag = document.getElementById('project-tag');
      const infoMeta = document.getElementById('project-meta');
      const infoIntro = document.getElementById('project-intro');
      const infoLink = document.getElementById('project-link');
      const relatedList = document.getElementById('related-list');

      const groupLookup = {
        AI: ['llm-master', 'foundations-llms', 'llm-cookbook', 'dive-into-llms', 'learn-ai-engineering', 'rag-techniques', 'agents-towards-production', 'ecc', 'deepseek-coder', 'awesome-deepseek', 'clip'],
        Robotics: ['habitat-lab', 'navigation2', 'robot-bus', 'laser-geometry', 'obstacle-detector', 'fusioncore', 'vln-ce', 'navgpt'],
        AutonomousDriving: ['highwayenv', 'tactics2d', 'bevformer', 'openpcdet', 'uniad', 'end2end-driving', 'autoware', 'autoware-universe', 'apollo', 'openpilot', 'onevl', 'recogdrive'],
        Tools: ['python-robotics', 'cpp-robotics', 'stable-baselines3']
      };

      function getCategory(node) {
        if (groupLookup.AI.includes(node.id)) return 'AI';
        if (groupLookup.Robotics.includes(node.id)) return 'Robotics';
        if (groupLookup.AutonomousDriving.includes(node.id)) return 'Autonomous Driving';
        if (groupLookup.Tools.includes(node.id)) return 'Tools';
        return 'Other';
      }

      function renderGraph() {
        svg.innerHTML = '';

        const ns = 'http://www.w3.org/2000/svg';

        const edgeGroup = document.createElementNS(ns, 'g');
        edges.forEach(([sourceId, targetId]) => {
          const source = nodeMap[sourceId];
          const target = nodeMap[targetId];
          const line = document.createElementNS(ns, 'line');
          line.setAttribute('x1', source.x);
          line.setAttribute('y1', source.y);
          line.setAttribute('x2', target.x);
          line.setAttribute('y2', target.y);
          line.setAttribute('class', 'edge');
          edgeGroup.appendChild(line);
        });
        svg.appendChild(edgeGroup);

        nodes.forEach(node => {
          const g = document.createElementNS(ns, 'g');
          g.setAttribute('class', 'node');
          g.dataset.id = node.id;

          const r = 17;
          const circle = document.createElementNS(ns, 'circle');
          circle.setAttribute('cx', node.x);
          circle.setAttribute('cy', node.y);
          circle.setAttribute('r', r);
          circle.setAttribute('fill', node.color);
          circle.setAttribute('opacity', '0.95');
          g.appendChild(circle);

          const label = document.createElementNS(ns, 'text');
          label.setAttribute('x', node.x);
          label.setAttribute('y', node.y + 30);
          label.textContent = node.name;
          g.appendChild(label);

          g.addEventListener('click', () => updateSelection(node.id));
          svg.appendChild(g);
        });
      }

      function updateSelection(id) {
        const node = nodeMap[id];
        const category = getCategory(node);
        infoName.textContent = node.name;
        infoTag.textContent = category;

        infoMeta.innerHTML = '';
        const repoChip = document.createElement('span');
        repoChip.textContent = node.repo;
        infoMeta.appendChild(repoChip);

        node.tags.forEach(tag => {
          const tagEl = document.createElement('span');
          tagEl.textContent = tag;
          infoMeta.appendChild(tagEl);
        });

        infoIntro.textContent = node.summary;
        infoLink.href = node.url;
        infoLink.textContent = `访问 ${node.repo}`;

        const related = new Set();
        edges.forEach(([sourceId, targetId]) => {
          if (sourceId === id) related.add(targetId);
          if (targetId === id) related.add(sourceId);
        });

        relatedList.innerHTML = '';
        if (related.size === 0) {
          const item = document.createElement('li');
          item.textContent = '暂无直接关联';
          relatedList.appendChild(item);
        } else {
          [...related].slice(0, 5).forEach(linkId => {
            const linkNode = nodeMap[linkId];
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = linkNode.url;
            a.target = '_blank';
            a.rel = 'noreferrer';
            a.textContent = `${linkNode.name} · ${linkNode.repo}`;
            li.appendChild(a);
            relatedList.appendChild(li);
          });
        }

        document.querySelectorAll('.node').forEach(nodeGroup => {
          nodeGroup.classList.toggle('active', nodeGroup.dataset.id === id);
        });
      }

      renderGraph();
      updateSelection('llm-master');
    </script>
  </body>
</html>
